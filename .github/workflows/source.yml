name: Validate source

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:beautify
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:ui
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
      - run: cargo test -p packet-engine -p scan-engine -p radio-engine --locked
      - run: cargo test --manifest-path tauri-plugin-capture/tests/forwarder-host/Cargo.toml --locked
