[package]
name = "scan-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Bounded TCP discovery and service probes for SeekerShark"

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
serde_json = "1"
